{% load static %}<meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="{% if tema == 'claro' %}#0f5e55{% else %}#0e1413{% endif %}">
  <link rel="icon" type="image/svg+xml" href="{% static 'financas/img/favicon.svg' %}">
  <link rel="manifest" href="{% url 'financas:manifest' %}">
  <link rel="apple-touch-icon" href="{% static 'financas/img/apple-touch-icon.png' %}">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="{{ marca.nome }}">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'financas/css/ninho.css' %}">

  <script>
    // app instalável: registra o service worker (só arquivos visuais e a página sem conexão)
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("{% url 'financas:service_worker' %}").catch(() => {}));
    }
    // "Instalar app": no Chrome/Edge usa o convite do navegador; nos demais (ou sem HTTPS),
    // abre o passo a passo certo para o navegador em uso
    const jaInstalado = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
    const botoesInstalar = (visivel) => document.querySelectorAll("[data-instalar]").forEach((b) => (b.hidden = !visivel));
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      window.convitePWA = e;
      botoesInstalar(true);
    });
    window.addEventListener("appinstalled", () => botoesInstalar(false));
    document.addEventListener("DOMContentLoaded", () => botoesInstalar(!jaInstalado()));

    function casoDeInstalacao() {
      const ua = navigator.userAgent;
      if (!window.isSecureContext) return "inseguro";
      if (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return "ios";
      if (/Android/.test(ua)) return "android";
      if (/Firefox\//.test(ua)) return "firefox";
      if (/Safari\//.test(ua) && !/Chrome\/|Chromium\/|Edg\//.test(ua)) return "safari";
      return "chrome";
    }
    function instalarApp() {
      if (window.convitePWA) {
        window.convitePWA.prompt();
        window.convitePWA.userChoice.then((escolha) => {
          if (escolha.outcome === "accepted") botoesInstalar(false);
        }).finally(() => { window.convitePWA = null; });
        return;
      }
      const dialogo = document.getElementById("como-instalar");
      if (!dialogo) return;
      const caso = casoDeInstalacao();
      dialogo.querySelectorAll("[data-caso]").forEach((d) => (d.hidden = d.dataset.caso !== caso));
      dialogo.querySelectorAll("[data-endereco-atual]").forEach((c) => (c.textContent = location.origin + "/"));
      dialogo.showModal();
    }
    // botões "Copiar" (endereços para abrir em outro navegador ou aparelho)
    document.addEventListener("click", (e) => {
      const b = e.target.closest("[data-copiar]");
      if (!b) return;
      navigator.clipboard.writeText(b.dataset.copiar || location.origin + "/").then(() => {
        const antes = b.textContent;
        b.textContent = "Copiado!";
        setTimeout(() => (b.textContent = antes), 1500);
      });
    });

    // troca o tema na hora e guarda a escolha por 1 ano (o servidor lê o cookie)
    function trocarTema() {
      const novo = document.documentElement.dataset.tema === "claro" ? "escuro" : "claro";
      document.documentElement.dataset.tema = novo;
      document.cookie = "tema=" + novo + "; path=/; max-age=31536000; SameSite=Lax";
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = novo === "claro" ? "#0f5e55" : "#0e1413";
      document.querySelectorAll(".tema-switch").forEach((b) => b.setAttribute("aria-checked", novo === "claro"));
    }
  </script>
